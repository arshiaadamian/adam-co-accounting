<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Adam&amp;Co Accounting — accounting, tax, bookkeeping and payroll services for small businesses and individuals in Port Moody, BC."
    />
    <title>Adam&amp;Co Accounting</title>
  </head>
  <body>
    <!--
      Static copy of the contact form so Netlify detects it at build time.
      The interactive form is rendered by React in src/pages/Contact.jsx —
      keep the field names identical to this one.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
